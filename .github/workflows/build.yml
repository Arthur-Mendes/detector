name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Baixar love-android
        run: git clone --recurse-submodules --depth 1 --branch 11.5 https://github.com/love2d/love-android.git

      - name: Embutir o jogo
        run: |
          cd game
          zip -9 -r ../game.love .
          cd ..
          mkdir -p love-android/app/src/embed/assets
          cp game.love love-android/app/src/embed/assets/game.love

      - name: Adicionar modulo Bluetooth
        working-directory: love-android
        run: |
          G=$(find . -name GameActivity.java | head -1)
          if [ -z "$G" ]; then
            echo "GameActivity.java nao encontrado. Arquivos java existentes:"
            find . -name "*.java" | head -40
            exit 1
          fi
          echo "GameActivity em: $G"
          D=$(dirname "$G")
          PKG=$(grep -m1 '^package' "$G" | sed 's/package \(.*\);.*/\1/')
          echo "Pacote: $PKG"
          cat > $D/BleBridge.java << 'JAVA'
          package PKGNAME;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.le.AdvertiseCallback;
          import android.bluetooth.le.AdvertiseData;
          import android.bluetooth.le.AdvertiseSettings;
          import android.bluetooth.le.BluetoothLeAdvertiser;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.ParcelUuid;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetAddress;
          import java.util.ArrayList;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @SuppressLint("MissingPermission")
          public class BleBridge {
              private static final UUID SERVICE = UUID.fromString("7d1c0de0-0000-4a5e-9b1d-5eed0000d37c");
              private static final int TO_LUA = 9876;
              private static final Handler main = new Handler(Looper.getMainLooper());
              private static final ExecutorService net = Executors.newSingleThreadExecutor();
              private static Activity act;
              private static BluetoothAdapter adapter;
              private static BluetoothLeScanner scanner;
              private static BluetoothLeAdvertiser advertiser;
              private static ScanCallback scanCb;
              private static AdvertiseCallback advCb;
              private static DatagramSocket out;
              private static boolean started = false;
              private static boolean active = false;
              private static String advStatus = "?";
              private static String scanStatus = "?";
              private static int seen = 0;
              private static int ours = 0;

              private static String[] perms() {
                  if (Build.VERSION.SDK_INT >= 31) {
                      return new String[]{"android.permission.BLUETOOTH_SCAN",
                              "android.permission.BLUETOOTH_ADVERTISE",
                              "android.permission.BLUETOOTH_CONNECT",
                              "android.permission.ACCESS_FINE_LOCATION"};
                  }
                  return new String[]{"android.permission.ACCESS_FINE_LOCATION"};
              }

              private static ArrayList<String> missing() {
                  ArrayList<String> m = new ArrayList<>();
                  for (String p : perms()) {
                      if (Build.VERSION.SDK_INT >= 23
                              && act.checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                          m.add(p);
                      }
                  }
                  return m;
              }

              public static void start(Activity a) {
                  if (started) return;
                  started = true;
                  act = a;
                  ArrayList<String> m = missing();
                  if (!m.isEmpty() && Build.VERSION.SDK_INT >= 23) {
                      a.requestPermissions(m.toArray(new String[0]), 77);
                  }
                  waitPermissions();
              }

              private static void waitPermissions() {
                  if (missing().isEmpty()) {
                      init();
                  } else {
                      send("dbg java v6 esperando permissoes");
                      main.postDelayed(BleBridge::waitPermissions, 1000);
                  }
              }

              private static void init() {
                  BluetoothManager bm = (BluetoothManager) act.getSystemService(Context.BLUETOOTH_SERVICE);
                  adapter = bm.getAdapter();
                  hello();
              }

              private static void hello() {
                  if (adapter == null || !adapter.isEnabled()) {
                      active = false;
                      send("btoff");
                  } else {
                      send("hello");
                      if (!active) {
                          active = true;
                          startAll();
                      }
                      send("dbg java v6 anuncio:" + advStatus + " busca:" + scanStatus
                              + " viu:" + seen + " nosso:" + ours);
                  }
                  main.postDelayed(BleBridge::hello, 1000);
              }

              private static void send(final String s) {
                  net.execute(() -> {
                      try {
                          if (out == null) out = new DatagramSocket();
                          byte[] b = s.getBytes();
                          out.send(new DatagramPacket(b, b.length, InetAddress.getByName("127.0.0.1"), TO_LUA));
                      } catch (Exception e) { }
                  });
              }

              private static void startAll() {
                  try { startAdvertising(); } catch (Exception e) { advStatus = "erro " + e; }
                  try { startScanning(); } catch (Exception e) { scanStatus = "erro " + e; }
              }

              private static void startAdvertising() {
                  advertiser = adapter.getBluetoothLeAdvertiser();
                  if (advertiser == null) { advStatus = "indisponivel"; return; }
                  AdvertiseSettings st = new AdvertiseSettings.Builder()
                          .setAdvertiseMode(AdvertiseSettings.ADVERTISE_MODE_LOW_LATENCY)
                          .setTxPowerLevel(AdvertiseSettings.ADVERTISE_TX_POWER_HIGH)
                          .setConnectable(false).setTimeout(0).build();
                  AdvertiseData data = new AdvertiseData.Builder()
                          .setIncludeDeviceName(false)
                          .addServiceUuid(new ParcelUuid(SERVICE)).build();
                  advCb = new AdvertiseCallback() {
                      @Override
                      public void onStartSuccess(AdvertiseSettings s) { advStatus = "ok"; }
                      @Override
                      public void onStartFailure(int code) { advStatus = "falhou" + code; }
                  };
                  advStatus = "iniciando";
                  advertiser.startAdvertising(st, data, advCb);
              }

              private static void startScanning() {
                  scanner = adapter.getBluetoothLeScanner();
                  if (scanner == null) { scanStatus = "indisponivel"; return; }
                  ScanSettings st = new ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY).build();
                  scanCb = new ScanCallback() {
                      @Override
                      public void onScanResult(int type, ScanResult r) {
                          seen++;
                          if (r.getScanRecord() != null && r.getScanRecord().getServiceUuids() != null) {
                              for (ParcelUuid u : r.getScanRecord().getServiceUuids()) {
                                  if (u.getUuid().equals(SERVICE)) {
                                      ours++;
                                      send("rssi " + r.getRssi());
                                  }
                              }
                          }
                      }
                      @Override
                      public void onScanFailed(int code) { scanStatus = "falhou" + code; }
                  };
                  scanStatus = "ok";
                  scanner.startScan(null, st, scanCb);
              }
          }
          JAVA

          sed -i "s/PKGNAME/$PKG/" $D/BleBridge.java

          # chama o modulo quando o app abre
          sed -i '0,/super.onCreate(savedInstanceState);/s//super.onCreate(savedInstanceState);\n        BleBridge.start(this);/' $G
          grep -q "BleBridge.start" $G

          # permissoes (so adiciona as que faltam)
          M=$(find app -name AndroidManifest.xml | grep 'src/main' | head -1)
          echo "Manifest em: $M"
          for P in INTERNET BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE ACCESS_FINE_LOCATION; do
            grep -q "android.permission.$P\"" $M || sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.$P\" \/>\n    <application/" $M
          done

      - name: Compilar (versao que abre arquivos .love)
        working-directory: love-android
        run: |
          chmod +x gradlew
          grep -n -A30 'productFlavors' app/build.gradle || true
          ok=0
          for T in assembleNormalNoRecordDebug assembleNoEmbedNoRecordDebug assembleNoRecordDebug; do
            echo "Tentando $T"
            if ./gradlew $T --no-daemon; then ok=1; break; fi
          done
          test $ok = 1

      - uses: actions/upload-artifact@v4
        with:
          name: detector-apk
          path: love-android/app/build/outputs/apk/**/*.apk
          
